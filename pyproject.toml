[project]
name = "moon-run-swallows-exit-codes"
version = "0.1.0"
description = "Reproducer: moon run collapses a task's exit code and stops sibling tasks at the first failure"
requires-python = ">=3.12"
dependencies = [
  "rich-click",
]

[project.scripts]
random-tolerated-code = "moon_repro.random_tolerated_code:cli"
genuine-failure = "moon_repro.genuine_failure:cli"
signal-task = "moon_repro.signal_task:cli"
fold-recorded-signals = "moon_repro.fold_recorded_signals:cli"
allowed-to-fail = "moon_repro.allowed_to_fail:cli"
expect-exit-code = "moon_repro.expect_exit_code:cli"
expect-finished = "moon_repro.expect_finished:cli"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[build-system]
requires = [
  "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/moon_repro",
]
