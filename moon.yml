language: python

tasks:
  random-tolerated-code:
    command: 'uv run --no-sync random-tolerated-code'
    toolchain: system
    inputs: []
    options:
      cache: false
      runFromWorkspaceRoot: true

  tolerated-defect:
    command: 'uv run --no-sync signal-task exit tolerated-defect 2 1'
    toolchain: system
    inputs: []
    options:
      cache: false
      runFromWorkspaceRoot: true

  skipped:
    command: 'uv run --no-sync signal-task exit skipped 4 3'
    toolchain: system
    inputs: []
    options:
      cache: false
      runFromWorkspaceRoot: true

  retried:
    command: 'uv run --no-sync signal-task exit retried 8 5'
    toolchain: system
    inputs: []
    options:
      cache: false
      runFromWorkspaceRoot: true

  tolerated-defect-recorded:
    command: 'uv run --no-sync signal-task record tolerated-defect 2 1'
    toolchain: system
    inputs: []
    options:
      cache: false
      runFromWorkspaceRoot: true

  skipped-recorded:
    command: 'uv run --no-sync signal-task record skipped 4 3'
    toolchain: system
    inputs: []
    options:
      cache: false
      runFromWorkspaceRoot: true

  retried-recorded:
    command: 'uv run --no-sync signal-task record retried 8 5'
    toolchain: system
    inputs: []
    options:
      cache: false
      runFromWorkspaceRoot: true

  tolerated-defect-allow-failure:
    extends: tolerated-defect
    options:
      allowFailure: true

  skipped-allow-failure:
    extends: skipped
    options:
      allowFailure: true

  retried-allow-failure:
    extends: retried
    options:
      allowFailure: true

  genuine-failure:
    command: 'uv run --no-sync genuine-failure'
    toolchain: system
    inputs: []
    options:
      cache: false
      runFromWorkspaceRoot: true

  allow-failure-genuine-failure:
    extends: genuine-failure
    options:
      allowFailure: true
